<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon Planning — Coaching Sur-Mesure</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="brand-mark">Coaching <em>Sur-Mesure</em></a>
  </div>
</header>

<div class="gen-wrap" id="app" style="max-width:760px; margin:0 auto; padding:24px 16px 60px;">
  <p style="text-align:center; color:var(--ink-light); padding:60px 0;">Chargement…</p>
</div>

<footer class="site-footer">
  <div class="footer-inner"><a href="index.html" class="footer-back">← Retour au site</a></div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>
const ZONE_LABELS = {
  pectoraux:"Pectoraux", dos:"Dos", epaules:"Épaules", trapezes:"Trapèzes", lombaires:"Lombaires",
  biceps:"Biceps", triceps:"Triceps", avant_bras:"Avant-bras", abdominaux:"Abdominaux", obliques:"Obliques",
  fessiers:"Fessiers", quadriceps:"Quadriceps", ischio_jambiers:"Ischio-jambiers", adducteurs:"Adducteurs",
  mollets:"Mollets", full_body:"Full body / Cardio",
};
const REPAS_LABELS = { petit_dej:"Petit-déjeuner", collation_matin:"Collation (matin)", dejeuner:"Déjeuner", gouter:"Goûter / collation (après-midi)", diner:"Dîner" };
const JOURS = ["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];

const params = new URLSearchParams(window.location.search);
const clienteId = params.get("id");
let performances = [];
let dernierePlanning = null;

async function charger(){
  const app = document.getElementById("app");
  if (!clienteId){
    app.innerHTML = `<div class="card"><p>Lien invalide — demande à ton coach de te renvoyer ton lien personnel.</p></div>`;
    return;
  }
  const [{ data, error }, perfRes] = await Promise.all([
    supabaseClient.rpc("get_planning_partage", { p_cliente_id: clienteId }),
    supabaseClient.rpc("get_performances", { p_cliente_id: clienteId }),
  ]);
  const row = data && data[0];
  if (error || !row || !row.dernier_planning_sport){
    app.innerHTML = `<div class="card"><p>Ton planning n'est pas encore prêt, ou le lien n'est plus valide — demande à ton coach de te le renvoyer.</p></div>`;
    return;
  }
  performances = perfRes.data || [];
  dernierePlanning = row;
  render(row);
}

async function rafraichirPerformances(){
  const { data } = await supabaseClient.rpc("get_performances", { p_cliente_id: clienteId });
  performances = data || [];
  const scrollY = window.scrollY;
  render(dernierePlanning);
  window.scrollTo(0, scrollY);
}

function dernierePerf(nomExercice){
  const hist = performances.filter(p => p.nom_exercice === nomExercice);
  return hist.length ? hist[hist.length - 1] : null;
}

function sparkline(points){
  const width = 280, height = 76, pad = 16;
  const xs = points.map((_,i) => points.length === 1 ? width/2 : pad + i * (width - 2*pad) / (points.length - 1));
  const values = points.map(p => p.poids);
  const min = Math.min(...values), max = Math.max(...values);
  const range = max - min || 1;
  const ys = values.map(v => height - pad - ((v - min) / range) * (height - 2*pad));
  const path = xs.map((x,i) => `${i===0?'M':'L'}${x.toFixed(1)},${ys[i].toFixed(1)}`).join(' ');
  const last = points.length - 1;
  const evolution = points[last].poids - points[0].poids;
  const evoTxt = evolution > 0 ? `+${evolution}kg depuis le début` : evolution < 0 ? `${evolution}kg depuis le début` : "stable depuis le début";
  const evoColor = evolution > 0 ? "#56633A" : evolution < 0 ? "#B5573B" : "#7C6C56";
  return `
    <svg viewBox="0 0 ${width} ${height}" width="100%" height="${height}" role="img" aria-label="Évolution du poids sur ${points.length} séances">
      <path d="${path}" fill="none" stroke="#6F7F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      ${xs.map((x,i) => `<circle cx="${x.toFixed(1)}" cy="${ys[i].toFixed(1)}" r="${i===last?4.5:3}" fill="${i===last?'#56633A':'#6F7F4A'}"><title>${points[i].dateLabel} — ${points[i].poids}kg${points[i].repetitions?' × '+points[i].repetitions+' reps':''}</title></circle>`).join('')}
    </svg>
    <div style="display:flex; justify-content:space-between; font-size:12px; color:var(--ink-light); margin-top:2px;">
      <span>${points[0].dateLabel} · ${points[0].poids}kg</span>
      <span style="font-weight:600; color:${evoColor};">${points[last].dateLabel} · ${points[last].poids}kg (${evoTxt})</span>
    </div>
  `;
}

function renderProgression(){
  const parExercice = {};
  performances.forEach(p => {
    if (p.poids == null) return;
    (parExercice[p.nom_exercice] = parExercice[p.nom_exercice] || []).push(p);
  });
  const exercicesAvecHistorique = Object.keys(parExercice).filter(nom => parExercice[nom].length >= 2);
  if (!exercicesAvecHistorique.length) return "";
  return `
    <h3 style="font-size:19px; margin:28px 0 12px;">Ma progression</h3>
    ${exercicesAvecHistorique.map(nom => {
      const points = parExercice[nom].map(p => ({
        poids: Number(p.poids), repetitions: p.repetitions,
        dateLabel: new Date(p.created_at).toLocaleDateString("fr-FR", { day:"numeric", month:"short" }),
      }));
      return `<div class="card" style="margin-bottom:14px;">
        <strong style="font-size:14px;">${nom}</strong>
        ${sparkline(points)}
      </div>`;
    }).join("")}
  `;
}

function render(row){
  const app = document.getElementById("app");
  const planSport = row.dernier_planning_sport;
  const planRepas = row.dernier_planning_repas;
  const liste = row.derniere_liste_courses || [];

  const joursAffiches = [...planSport.seances.map(s => ({ ...s, repos:false })), ...(planSport.reposJours||[])]
    .sort((a,b) => JOURS.indexOf(a.jour) - JOURS.indexOf(b.jour));

  app.innerHTML = `
    <div class="form-intro">
      <div class="eyebrow">Coaching sport & nutrition</div>
      <h1 style="font-size:26px; margin-top:6px;">Le planning de ${row.prenom || "toi"}</h1>
      <p>Mis à jour le ${new Date(row.updated_at).toLocaleDateString("fr-FR", { day:"numeric", month:"long", year:"numeric" })}. Enregistre le poids et les répétitions à chaque séance pour suivre ta progression au fil des semaines.</p>
    </div>

    <h3 style="font-size:19px; margin-bottom:12px;">Planning sport</h3>
    ${joursAffiches.map(s => s.repos ? `
      <div class="plan-day">
        <h3>${s.jour} — Repos</h3>
        <div class="day-meta" style="color:var(--ink-light);">${s.suggestion}</div>
      </div>
    ` : `
      <div class="plan-day" data-jour="${s.jour}">
        <h3>${s.jour} — ${s.typeJour}</h3>
        <table class="plan-table">
          <thead><tr><th>Exercice</th><th>Zone</th><th>Format</th><th colspan="3">Enregistrer ma séance</th></tr></thead>
          <tbody>${s.exercices.map((e,i) => {
            const dernier = dernierePerf(e.nom);
            const nomAttr = e.nom.replace(/"/g,'&quot;');
            return `<tr>
              <td>${e.nom}${dernier ? `<div class="hint" style="margin-top:2px;">Dernière fois : ${dernier.poids}kg${dernier.repetitions ? ' × ' + dernier.repetitions : ''}</div>` : ""}</td>
              <td>${ZONE_LABELS[e.zone]||e.zone}</td>
              <td>${e.format}</td>
              <td><input type="number" step="0.5" class="ex-poids-input" placeholder="kg" style="width:56px;"></td>
              <td><input type="number" step="1" class="ex-reps-input" placeholder="reps" style="width:56px;"></td>
              <td><button type="button" class="btn-ghost ex-log-btn" data-jour="${s.jour}" data-nom="${nomAttr}" data-zone="${e.zone}" style="width:auto; white-space:nowrap;">Enregistrer</button></td>
            </tr>`;
          }).join("")}</tbody>
        </table>
        ${s.etirements && s.etirements.length ? `
        <div style="margin-top:10px;">
          <strong style="font-size:13px; color:var(--ink-light);">Étirements (fin de séance)</strong>
          <ul style="margin:6px 0 0; padding-left:18px; font-size:13.5px;">${s.etirements.map(e => `<li>${e.nom} — ${e.format}</li>`).join("")}</ul>
        </div>` : ""}
      </div>
    `).join("")}

    ${renderProgression()}

    ${planRepas ? `
    <h3 style="font-size:19px; margin:28px 0 12px;">Planning repas</h3>
    ${planRepas.jours.map(j => `
      <div class="plan-day">
        <h3>${j.jour}</h3>
        ${Object.keys(j.repas).map(slot => {
          const r = j.repas[slot];
          if (!r) return "";
          return `
          <details class="meal-row" style="display:block;">
            <summary style="display:flex; justify-content:space-between; gap:10px; cursor:pointer; list-style:none;">
              <span class="slot">${REPAS_LABELS[slot] || slot}</span>
              <span>${r.nom}</span>
            </summary>
            <div class="meal-detail">
              <strong>Ingrédients</strong> (1 portion) : ${r.ingredients.map(i=>`${i.nom} (${i.quantite} ${i.unite})`).join(", ")}
              <div style="margin-top:8px;"><strong>Préparation</strong></div>
              <ol style="margin:6px 0 0; padding-left:18px;">${(r.etapes||[]).map(e=>`<li>${e}</li>`).join("") || "<li>Pas d'étapes renseignées.</li>"}</ol>
            </div>
          </details>`;
        }).join("")}
      </div>
    `).join("")}` : ""}

    ${liste.length ? `
    <h3 style="font-size:19px; margin:28px 0 12px;">Liste de courses (semaine)</h3>
    <div class="card">
      <div class="shopping-grid">
        ${liste.map(i => `<div>${i.nom} — ${i.quantite} ${i.unite}</div>`).join("")}
      </div>
    </div>` : ""}
  `;

  app.querySelectorAll(".ex-log-btn").forEach(btn => {
    btn.addEventListener("click", async () => {
      const row2 = btn.closest("tr");
      const poidsInput = row2.querySelector(".ex-poids-input");
      const repsInput = row2.querySelector(".ex-reps-input");
      const poids = poidsInput.value ? parseFloat(poidsInput.value.replace(",", ".")) : null;
      const repetitions = repsInput.value ? parseInt(repsInput.value, 10) : null;
      if (poids == null && repetitions == null){ return; }
      btn.disabled = true; const texteOriginal = btn.textContent; btn.textContent = "…";
      const { error } = await supabaseClient.from("performances").insert({
        cliente_id: clienteId, jour: btn.dataset.jour, nom_exercice: btn.dataset.nom, zone: btn.dataset.zone,
        poids, repetitions,
      });
      btn.disabled = false; btn.textContent = texteOriginal;
      if (error){ alert("Erreur d'enregistrement, réessaie."); return; }
      poidsInput.value = ""; repsInput.value = "";
      await rafraichirPerformances();
    });
  });
}

charger();
</script>
</body>
</html>
