<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="brand-mark">Coaching <em>Sur-Mesure</em></a>
    <div style="display:flex; gap:10px;">
      <a href="tableau-de-bord.html" class="header-cta" style="background:transparent; color:var(--ink-light); border:1px solid var(--line);">Tableau de bord</a>
      <a href="admin.html" class="header-cta" style="background:transparent; color:var(--ink-light); border:1px solid var(--line);">Gérer la base</a>

<div id="app" class="gen-wrap" style="display:none;"></div>

<footer class="site-footer">
  <div class="footer-inner">
    <a href="index.html" class="footer-back">← Retour au site</a>
  </div>
</footer>

<!-- Assistant — n'est utile que sur une fiche cliente ouverte, donc affiché
     seulement quand clienteActuelleId est défini (voir toggleAssistantBulle). -->
<button id="assistant-bulle" type="button" title="Parler à l'assistant" style="display:none; position:fixed; right:22px; bottom:22px; width:56px; height:56px; border-radius:50%; background:var(--terracotta); color:#fff; border:none; font-size:24px; box-shadow:0 4px 14px rgba(0,0,0,0.25); cursor:pointer; z-index:100;">💬</button>
<div id="assistant-panel" style="display:none; position:fixed; right:22px; bottom:88px; width:340px; max-width:calc(100vw - 44px); height:440px; max-height:calc(100vh - 140px); background:var(--cream-light); border:1px solid var(--line); border-radius:8px; box-shadow:0 8px 28px rgba(0,0,0,0.25); z-index:100; display:flex; flex-direction:column; overflow:hidden;">
  <div style="padding:12px 14px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center;">
    <strong style="font-size:13.5px;">Assistant — <span id="assistant-prenom"></span></strong>
    <button type="button" id="assistant-fermer-btn" style="width:auto; background:none; border:none; color:var(--ink-light); cursor:pointer; font-size:16px;">✕</button>
  </div>
  <div id="assistant-messages" style="flex:1; overflow-y:auto; padding:12px 14px; font-size:13px; display:flex; flex-direction:column; gap:8px;"></div>
  <div style="display:flex; gap:6px; padding:10px; border-top:1px solid var(--line);">
    <input type="text" id="assistant-input" placeholder="Ex : Lundi elle a fait de la course" style="flex:1; font-size:13px;">
    <button type="button" id="assistant-envoyer-btn" class="btn-ghost" style="width:auto;">Envoyer</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="generateur.js"></script>
<script>
let EXERCICES = [];
let RECETTES = [];

const ZONE_LABELS = {
  pectoraux:"Pectoraux", dos:"Dos", epaules:"Épaules", trapezes:"Trapèzes", lombaires:"Lombaires",
  biceps:"Biceps", triceps:"Triceps", avant_bras:"Avant-bras / Poignets",
  abdominaux:"Abdominaux", obliques:"Obliques",
  fessiers:"Fessiers", quadriceps:"Quadriceps", ischio_jambiers:"Ischio-jambiers", adducteurs:"Adducteurs", mollets:"Mollets",
  full_body:"Full body / Cardio",
};
const SANTE_LABELS = { genoux:"Genoux", dos:"Dos", epaules:"Épaules", poignets:"Poignets", hanches:"Hanches", chevilles:"Chevilles" };
const SANTE_HORMONALE_LABELS = { regles_douloureuses:"Règles douloureuses", endometriose:"Endométriose", sopk:"SOPK (ovaires polykystiques)" };
const ALIMENT_LABELS = { gluten:"Gluten", lactose:"Lactose", oeuf:"Œuf", poisson:"Poisson", fruits_de_mer:"Fruits de mer", porc:"Porc", noix:"Noix / oléagineux", arachides:"Arachides", soja:"Soja" };
const REPAS_LABELS = { petit_dej:"Petit-déjeuner", collation_matin:"Collation (matin)", dejeuner:"Déjeuner", gouter:"Goûter / collation (après-midi)", diner:"Dîner" };
const OBJECTIF_LABELS = { perte_poids:"Perte de poids / sèche", prise_masse:"Prise de masse", tonus:"Tonification", energie:"Énergie au quotidien", reprise:"Reprise de routine", endurance:"Endurance" };
const SUPERMARCHE_LABELS = { lidl:"Lidl", aldi:"Aldi", intermarche:"Intermarché", leclerc:"Leclerc", carrefour:"Carrefour", auchan:"Auchan", super_u:"Super U", casino:"Casino", monoprix:"Monoprix" };
const REPAS_DEFAUT = {
  prise_masse: ["petit_dej","collation_matin","dejeuner","gouter","diner"],
  tonus: ["petit_dej","dejeuner","gouter","diner"],
  perte_poids: ["petit_dej","dejeuner","diner"],
  energie: ["petit_dej","dejeuner","gouter","diner"],
  reprise: ["petit_dej","dejeuner","gouter","diner"],
  endurance: ["petit_dej","dejeuner","gouter","diner"],
};

let clienteActuelleId = null;
let prospectActuelId = null;
let dernierResultat = null; // { client, planSport, planRepas, liste, horaire }
let activitesLibres = []; // activités que la cliente a faites de son côté, ajoutées par la coach

async function chargerActivitesLibres(id){
  if (!id){ activitesLibres = []; return; }
  const { data, error } = await supabaseClient.from("activites_libres").select("*").eq("cliente_id", id).order("created_at");
  activitesLibres = error ? [] : data;
}

async function ajouterActiviteLibre(jour, description){
  if (!clienteActuelleId || !description.trim()) return;
  const { data, error } = await supabaseClient.from("activites_libres")
    .insert({ cliente_id: clienteActuelleId, jour, description: description.trim() }).select().single();
  if (error){ alert("Erreur : " + error.message); return; }
  activitesLibres.push(data);
  rerenderResultats();
}

async function retirerActiviteLibre(id){
  await supabaseClient.from("activites_libres").delete().eq("id", id);
  activitesLibres = activitesLibres.filter(a => a.id !== id);
  rerenderResultats();
}

// ---- Assistant (chat en langage naturel, scopé à la fiche ouverte) ----
let assistantHistory = []; // échanges texte renvoyés par la fonction, pour la mémoire de conversation
let assistantMessages = []; // { role: "user"|"assistant"|"erreur", texte } — pour l'affichage
let assistantPrenomActuel = "";

function toggleAssistantBulle(){
  const bulle = document.getElementById("assistant-bulle");
  const panel = document.getElementById("assistant-panel");
  if (clienteActuelleId){
    bulle.style.display = "flex";
    bulle.style.alignItems = "center";
    bulle.style.justifyContent = "center";
  } else {
    bulle.style.display = "none";
    panel.style.display = "none";
  }
}

function reinitialiserAssistant(prenom){
  assistantHistory = [];
  assistantMessages = [];
  assistantPrenomActuel = prenom || "";
  document.getElementById("assistant-prenom").textContent = assistantPrenomActuel;
  renderAssistantMessages();
}

function renderAssistantMessages(){
  const box = document.getElementById("assistant-messages");
  if (!assistantMessages.length){
    box.innerHTML = `<div style="color:var(--ink-light); font-style:italic;">Dis-lui ce qui a changé, ce qu'il faut ajuster, ou pose une question sur ${assistantPrenomActuel || "la cliente"} — il agit directement sur sa fiche.</div>`;
    return;
  }
  box.innerHTML = assistantMessages.map(m => `
    <div style="align-self:${m.role === "user" ? "flex-end" : "flex-start"}; max-width:85%; background:${m.role === "user" ? "var(--terracotta)" : m.role === "erreur" ? "#fdf1ee" : "var(--cream)"}; color:${m.role === "user" ? "#fff" : "var(--ink)"}; border:${m.role === "erreur" ? "1px solid var(--terracotta-dark)" : "1px solid var(--line)"}; border-radius:10px; padding:7px 10px; white-space:pre-wrap;">${m.texte}</div>
  `).join("");
  box.scrollTop = box.scrollHeight;
}

async function envoyerMessageAssistant(){
  const input = document.getElementById("assistant-input");
  const message = input.value.trim();
  if (!message || !clienteActuelleId) return;
  input.value = "";
  input.disabled = true;
  assistantMessages.push({ role:"user", texte: message });
  renderAssistantMessages();

  const { data, error } = await supabaseClient.functions.invoke("assistant-coach", {
    body: { cliente_id: clienteActuelleId, message, history: assistantHistory },
  });
  input.disabled = false;
  input.focus();

  if (error || !data || data.error){
    assistantMessages.push({ role:"erreur", texte: (data && data.error) || error?.message || "L'assistant n'a pas répondu — réessaie." });
    renderAssistantMessages();
    return;
  }
  assistantMessages.push({ role:"assistant", texte: data.reply });
  assistantHistory = data.history || assistantHistory;
  renderAssistantMessages();
  if (data.plan_modifie){
    await chargerActivitesLibres(clienteActuelleId);
    const { data: fraiche } = await supabaseClient.from("clientes").select("*").eq("id", clienteActuelleId).single();
    if (fraiche){
      const client = collecterClient();
      dernierResultat = { client, planSport: fraiche.dernier_planning_sport, planRepas: fraiche.dernier_planning_repas, liste: fraiche.derniere_liste_courses || [], horaire: dernierResultat?.horaire || null };
      afficherResultats(client, dernierResultat.planSport, dernierResultat.planRepas, dernierResultat.liste, dernierResultat.horaire, true);
    }
  }
}

document.getElementById("assistant-bulle").addEventListener("click", () => {
  const panel = document.getElementById("assistant-panel");
  panel.style.display = panel.style.display === "none" ? "flex" : "none";
  if (panel.style.display === "flex") document.getElementById("assistant-input").focus();
});
document.getElementById("assistant-fermer-btn").addEventListener("click", () => {
  document.getElementById("assistant-panel").style.display = "none";
});
document.getElementById("assistant-envoyer-btn").addEventListener("click", envoyerMessageAssistant);
document.getElementById("assistant-input").addEventListener("keydown", (e) => {
  if (e.key === "Enter"){ e.preventDefault(); envoyerMessageAssistant(); }
});

// ---- Authentification ----
async function verifierSession(){
  const { data } = await supabaseClient.auth.getSession();
  if (!data.session){
    window.location.href = "login.html";
    return;
  }
  document.getElementById("app").innerHTML = `<p style="text-align:center; color:var(--ink-light); padding:60px 0;">Chargement…</p>`;
  document.getElementById("app").style.display = "block";
  await chargerBibliotheque();
  renderForm();
  chargerListeClientes();
  chargerProspects();
  const idDepuisLien = new URLSearchParams(window.location.search).get("cliente");
  if (idDepuisLien) chargerCliente(idDepuisLien);
}
verifierSession();

async function chargerBibliotheque(){
  const [ex, re] = await Promise.all([
    supabaseClient.from("exercices").select("*"),
    supabaseClient.from("recettes").select("*"),
  ]);
  if (ex.error || re.error){
    alert("Erreur de chargement de la bibliothèque : " + (ex.error?.message || re.error?.message));
    return;
  }
  EXERCICES = ex.data;
  RECETTES = re.data;
}

document.getElementById("logout-btn").addEventListener("click", async () => {
  await supabaseClient.auth.signOut();
  window.location.href = "login.html";
});

// ---- Construction du formulaire ----
function exercicesParZone(){
  const parZone = {};
  EXERCICES.forEach(e => { (parZone[e.zone] = parZone[e.zone] || []).push(e); });
  return parZone;
}

function renderForm(){
  const parZone = exercicesParZone();
  const joursOptions = JOURS.map(j => `<label class="checkbox-chip"><input type="checkbox" name="jour" value="${j}"> ${j}</label>`).join("");
  const joursReposOptions = JOURS.map(j => `<label class="checkbox-chip"><input type="checkbox" name="jour-repos" value="${j}"> ${j}</label>`).join("");
  const santeHormonaleOptions = Object.keys(SANTE_HORMONALE_LABELS).map(s => `<label class="checkbox-chip"><input type="checkbox" name="sante-hormonale" value="${s}"> ${SANTE_HORMONALE_LABELS[s]}</label>`).join("");
  const zonesOptions = Object.keys(ZONE_LABELS).filter(z => z !== "full_body").map(z => `<label class="checkbox-chip"><input type="checkbox" name="zone" value="${z}"> ${ZONE_LABELS[z]}</label>`).join("");
  const santeOptions = Object.keys(SANTE_LABELS).map(s => `<label class="checkbox-chip"><input type="checkbox" name="sante" value="${s}"> ${SANTE_LABELS[s]}</label>`).join("");
  const alimentOptions = Object.keys(ALIMENT_LABELS).map(a => `<label class="checkbox-chip"><input type="checkbox" name="aliment" value="${a}"> ${ALIMENT_LABELS[a]}</label>`).join("");
  const repasOptions = Object.keys(REPAS_LABELS).map(r => `<label class="checkbox-chip"><input type="checkbox" name="repas" value="${r}" ${["petit_dej","dejeuner","diner"].includes(r)?"checked":""}> ${REPAS_LABELS[r]}</label>`).join("");
  const excludeExosHtml = Object.keys(parZone).filter(z=>z!=="full_body").map(zone => `
    <details style="margin-bottom:8px;">
      <summary style="cursor:pointer; font-size:13.5px; font-weight:600;">${ZONE_LABELS[zone]}</summary>
      <div class="checkbox-list" style="margin-top:8px;">
        ${parZone[zone].map(e => `<label class="checkbox-chip"><input type="checkbox" name="exclude-exo" value="${e.id}"> ${e.nom}</label>`).join("")}
      </div>
    </details>`).join("");
  const preferExosHtml = Object.keys(parZone).filter(z=>z!=="full_body").map(zone => `
    <details style="margin-bottom:8px;">
      <summary style="cursor:pointer; font-size:13.5px; font-weight:600;">${ZONE_LABELS[zone]}</summary>
      <div class="checkbox-list" style="margin-top:8px;">
        ${parZone[zone].map(e => `<label class="checkbox-chip"><input type="checkbox" name="prefer-exo" value="${e.id}"> ${e.nom}</label>`).join("")}
      </div>
    </details>`).join("");
  const RECETTE_TYPE_LABELS = { petit_dej:"Petit-déjeuner", collation:"Collations", dejeuner_diner:"Déjeuner / Dîner" };
  const parTypeRecette = {};
  RECETTES.forEach(r => { (parTypeRecette[r.repas] = parTypeRecette[r.repas] || []).push(r); });
  const preferRecettesHtml = Object.keys(parTypeRecette).map(type => `
    <details style="margin-bottom:8px;">
      <summary style="cursor:pointer; font-size:13.5px; font-weight:600;">${RECETTE_TYPE_LABELS[type] || type}</summary>
      <div class="checkbox-list" style="margin-top:8px;">
        ${parTypeRecette[type].map(r => `<label class="checkbox-chip"><input type="checkbox" name="prefer-recette" value="${r.id}"> ${r.nom}</label>`).join("")}
      </div>
    </details>`).join("");

  document.getElementById("app").innerHTML = `
    <div class="form-intro">
      <div class="eyebrow">Outil interne</div>
      <h1 style="font-size:26px; margin-top:6px;">Générateur de planning</h1>
      <p>Rentre les infos de la personne, génère son planning sport + repas + liste de courses.</p>
    </div>

    <fieldset id="prospects-fieldset" style="display:none;">
      <legend>Nouveaux prospects (questionnaire)</legend>
      <div id="liste-prospects" style="font-size:13.5px; color:var(--ink-light);"></div>
    </fieldset>

    <fieldset>
      <legend>Mes clientes</legend>
      <div id="liste-clientes" style="font-size:13.5px; color:var(--ink-light);">Chargement…</div>
      <button type="button" id="nouvelle-fiche-btn" class="btn-ghost" style="width:auto; margin-top:12px;">+ Nouvelle fiche</button>
    </fieldset>

    <div id="notes-prospect"></div>

    <div id="suivi-hebdo"></div>
    <div id="progression-exercices"></div>

    <form id="gen-form">
      <fieldset>
        <legend>Profil</legend>
        <div class="gen-form-grid">
          <div class="field"><label class="q">Prénom</label><input type="text" id="f-prenom"></div>
          <div class="field"><label class="q">Âge</label><input type="number" id="f-age" value="30"></div>
          <div class="field"><label class="q">Email</label><input type="email" id="f-email"></div>
          <div class="field"><label class="q">Téléphone</label><input type="tel" id="f-telephone"></div>
          <div class="field"><label class="q">Sexe</label>
            <select id="f-sexe"><option value="femme">Femme</option><option value="homme">Homme</option><option value="autre">Autre</option></select>
          </div>
          <div class="field"><label class="q">Objectif principal</label>
            <select id="f-objectif">${Object.keys(OBJECTIF_LABELS).map(o=>`<option value="${o}">${OBJECTIF_LABELS[o]}</option>`).join("")}</select>
          </div>
          <div class="field"><label class="q">Objectif secondaire</label>
            <div class="hint">Ex : perte de poids + prise de muscle en même temps</div>
            <select id="f-objectif-secondaire"><option value="">Aucun</option>${Object.keys(OBJECTIF_LABELS).map(o=>`<option value="${o}">${OBJECTIF_LABELS[o]}</option>`).join("")}</select>
          </div>
          <div class="field"><label class="q">Poids actuel (kg)</label><input type="number" id="f-poids-actuel" value="70"></div>
          <div class="field"><label class="q">Poids souhaité (kg)</label><input type="number" id="f-poids-souhaite"></div>
          <div class="field"><label class="q">Niveau</label>
            <select id="f-niveau"><option value="debutant">Débutant(e)</option><option value="intermediaire">Intermédiaire</option><option value="avance">Avancé(e)</option></select>
          </div>
          <div class="field"><label class="q">Type d'effort</label>
            <select id="f-type-effort"><option value="mix">Mix cardio + renfo</option><option value="cardio">Cardio uniquement</option><option value="renfo">Renforcement uniquement</option></select>
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Zones prioritaires</legend>
        <div class="checkbox-list">${zonesOptions}</div>
      </fieldset>

      <fieldset>
        <legend>Problèmes de santé / zones à ménager</legend>
        <div class="checkbox-list">${santeOptions}</div>
        <div class="field" style="margin-top:14px;">
          <label class="q">Santé hormonale / menstruelle</label>
          <div class="hint">Adapte automatiquement les séances et les recettes (évite les abdos à forte pression, privilégie des recettes riches en oméga-3/fer/magnésium) — ce sont des adaptations d'entraînement courantes, pas un avis médical.</div>
          <div class="checkbox-list">${santeHormonaleOptions}</div>
        </div>
        <div class="field" style="margin-top:14px;">
          <label class="q">Maladie chronique / autre condition médicale</label>
          <div class="hint">Info libre pour toi (ex : diabète, arthrose, maladie du conjoint suivi sur la même fiche...) — à prendre en compte manuellement dans les choix d'exercices.</div>
          <textarea id="f-maladie-chronique" rows="2"></textarea>
        </div>
        <div class="field" style="margin-top:14px;">
          <label class="checkbox-chip"><input type="checkbox" id="f-douleur-actuelle"> Douleurs en ce moment — adapter la séance du jour (charge allégée, abdos à faible pression, nutrition anti-inflammatoire)</label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Exercices à exclure (détestés / déconseillés)</legend>
        ${excludeExosHtml}
      </fieldset>

      <fieldset>
        <legend>Exercices préférés (à privilégier dans le planning)</legend>
        ${preferExosHtml}
      </fieldset>

      <fieldset>
        <legend>Logistique d'entraînement</legend>
        <div class="gen-form-grid">
          <div class="field"><label class="q">Jours disponibles</label><div class="checkbox-list">${joursOptions}</div></div>
          <div class="field">
            <label class="q">Jour(s) de repos souhaité(s)</label>
            <div class="hint">Parmi les jours disponibles — ce jour ne recevra jamais de séance, même si la cliente vient quand même à la salle</div>
            <div class="checkbox-list">${joursReposOptions}</div>
          </div>
          <div class="field"><label class="q">Durée par séance (min)</label><input type="number" id="f-duree" value="45"></div>
          <div class="field"><label class="q">Lieu</label>
            <select id="f-lieu"><option value="salle">Salle de sport</option><option value="maison">Maison</option><option value="exterieur">Extérieur</option><option value="mixte">Mixte</option></select>
          </div>
          <div class="field"><label class="q">Matériel disponible</label>
            <select id="f-materiel"><option value="aucun">Aucun</option><option value="quelques_accessoires">Quelques accessoires</option><option value="complet">Équipement complet</option></select>
          </div>
          <div class="field"><label class="q">Moment préféré</label>
            <select id="f-moment"><option value="matin">Matin</option><option value="midi">Midi</option><option value="soir">Soir</option></select>
          </div>
          <div class="field"><label class="q">Délai souhaité pour la transformation (mois)</label>
            <div class="hint">Utilisé pour proposer de la marche/activité légère les jours de repos si le délai est court</div>
            <input type="number" id="f-delai-mois" min="0">
          </div>
        </div>
        <div id="horaire-fields" class="gen-form-grid" style="margin-top:16px;">
          <div class="field"><label class="q">Heure de réveil</label><input type="time" id="f-heure-reveil" value="06:30"></div>
          <div class="field"><label class="q">Heure de début de travail</label><input type="time" id="f-heure-travail" value="09:00"></div>
          <div class="field"><label class="q">Trajet domicile → salle (min)</label><input type="number" id="f-trajet-ds" value="10"></div>
          <div class="field"><label class="q">Trajet salle → travail (min)</label><input type="number" id="f-trajet-st" value="15"></div>
          <div class="field"><label class="q">Temps pour manger / se préparer avant le travail (min)</label><input type="number" id="f-tampon-repas" value="60"></div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Nutrition</legend>
        <div class="checkbox-list" style="margin-bottom:14px;">
          <label class="checkbox-chip"><input type="checkbox" id="f-vegetarien"> Végétarien</label>
          <label class="checkbox-chip"><input type="checkbox" id="f-vegan"> Végan</label>
          <label class="checkbox-chip"><input type="checkbox" id="f-sans-gluten"> Sans gluten</label>
          <label class="checkbox-chip"><input type="checkbox" id="f-sans-lactose"> Sans lactose</label>
        </div>
        <div class="field"><label class="q">Allergies / aliments à éviter</label>${alimentOptions}</div>
        <div class="field" style="margin-top:14px;">
          <label class="q">Autres aliments précis à éviter</label>
          <div class="hint">Ex : jambon, fromage grec — tape et clique Ajouter</div>
          <div style="display:flex; gap:8px;">
            <input type="text" id="f-aliment-libre-input" placeholder="Ex : jambon">
            <button type="button" id="ajouter-aliment-libre-btn" class="btn-ghost" style="width:auto;">Ajouter</button>
          </div>

function valeursCochees(name){

function cocherValeurs(name, valeurs){
  const set = new Set(valeurs || []);
  document.querySelectorAll(`input[name="${name}"]`).forEach(cb => { cb.checked = set.has(cb.value); });
}
function timeToMinutes(hhmm){
  if (!hhmm) return null;
  const [h,m] = hhmm.split(":").map(Number);
  return h*60+m;
}

function mapProspectToClient(r){
  const OBJECTIF_MAP = { "Perte de poids":"perte_poids", "Tonus musculaire":"tonus", "Énergie au quotidien":"energie", "Reprise de routine":"reprise", "Prise de masse":"prise_masse", "Endurance":"endurance" };
  const NIVEAU_MAP = { "Débutant(e)":"debutant", "Intermédiaire":"intermediaire", "Avancé(e)":"avance" };
  const LIEU_MAP = { "Salle de sport":"salle", "Maison":"maison", "Extérieur":"exterieur", "Mixte":"mixte" };
  const MATERIEL_MAP = { "Aucun":"aucun", "Quelques accessoires":"quelques_accessoires", "Équipement complet":"complet" };
  const EFFORT_MAP = { "Cardio uniquement":"cardio", "Renforcement uniquement":"renfo", "Mix cardio + renfo":"mix" };
  const MOMENT_MAP = { "Matin":"matin", "Midi":"midi", "Fin d'après-midi":"soir", "Soir":"soir" };
  const ZONE_MAP = { "Pectoraux":"pectoraux", "Dos":"dos", "Épaules":"epaules", "Trapèzes":"trapezes", "Lombaires":"lombaires", "Biceps":"biceps", "Triceps":"triceps", "Avant-bras":"avant_bras", "Abdominaux":"abdominaux", "Obliques":"obliques", "Fessiers":"fessiers", "Quadriceps":"quadriceps", "Ischio-jambiers":"ischio_jambiers", "Adducteurs":"adducteurs", "Mollets":"mollets" };

  const joursTrouves = (r.jours_dispo || "").toLowerCase();
  const jours = JOURS.filter(j => joursTrouves.includes(j.toLowerCase()));

  const alimentsLibre = [r.aliments_eviter, r.allergies].filter(Boolean).join(", ")
    .split(/[,;\n]/).map(s => s.trim()).filter(Boolean);

  return {
    prenom: (r.prenom || "").split(" ")[0] || r.prenom,
    email: r.email, telephone: r.telephone,
    age: r.age ? Number(r.age) : undefined,
    objectif: OBJECTIF_MAP[(r.objectif || [])[0]],
    objectif_secondaire: OBJECTIF_MAP[(r.objectif || [])[1]],
    delai_mois: r.delai_mois ? Number(r.delai_mois) : undefined,
    poids_actuel: r.poids_actuel ? Number(r.poids_actuel) : undefined,
    poids_souhaite: r.poids_objectif ? Number(r.poids_objectif) : undefined,
    niveau: NIVEAU_MAP[r.niveau],
    type_effort: EFFORT_MAP[r.effort],
    zones_prioritaires: (r.zones || []).map(z => ZONE_MAP[z]).filter(Boolean),
    jours_dispo: jours,
    duree_seance: r.duree_seance ? Number(r.duree_seance) : undefined,
    lieu: LIEU_MAP[r.lieu],
    materiel: MATERIEL_MAP[r.materiel],
    moment_prefere: MOMENT_MAP[r.moment_forme],
    vegetarien: r.regime === "Végétarien" || r.regime === "Végan",
    vegan: r.regime === "Végan",
    sans_gluten: r.regime === "Sans gluten",
    aliments_evites_libre: alimentsLibre,
    budget_semaine: r.budget ? Number(r.budget) : undefined,
  };
}

function coherenceBadge(objectif, deltaPoids){
  if (deltaPoids == null || Math.abs(deltaPoids) < 0.1) return "";
  const veutBaisse = objectif === "perte_poids";
  const veutHausse = objectif === "prise_masse";
  if (!veutBaisse && !veutHausse) return "";
  const conforme = veutBaisse ? deltaPoids < 0 : deltaPoids > 0;
  return conforme
    ? `<span style="color:var(--accent, #5F6E3F); font-weight:600;">✓ conforme à l'objectif</span>`
    : `<span style="color:var(--terracotta-dark);">⚠ à l'inverse de l'objectif</span>`;
}

function sparklinePoids(points){
  const width = 280, height = 76, pad = 16;
  const xs = points.map((_,i) => points.length === 1 ? width/2 : pad + i * (width - 2*pad) / (points.length - 1));
  const values = points.map(p => p.poids);
  const min = Math.min(...values), max = Math.max(...values);
  const range = max - min || 1;
  const ys = values.map(v => height - pad - ((v - min) / range) * (height - 2*pad));
  const path = xs.map((x,i) => `${i===0?'M':'L'}${x.toFixed(1)},${ys[i].toFixed(1)}`).join(' ');
  const last = points.length - 1;
  const evolution = points[last].poids - points[0].poids;
  const evoTxt = evolution > 0 ? `+${evolution}kg depuis le début` : evolution < 0 ? `${evolution}kg depuis le début` : "stable depuis le début";
  const evoColor = evolution > 0 ? "#56633A" : evolution < 0 ? "#B5573B" : "#7C6C56";
  return `
    <svg viewBox="0 0 ${width} ${height}" width="100%" height="${height}" role="img" aria-label="Évolution du poids sur ${points.length} séances">
      <path d="${path}" fill="none" stroke="#6F7F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      ${xs.map((x,i) => `<circle cx="${x.toFixed(1)}" cy="${ys[i].toFixed(1)}" r="${i===last?4.5:3}" fill="${i===last?'#56633A':'#6F7F4A'}"><title>${points[i].dateLabel} — ${points[i].poids}kg${points[i].repetitions?' × '+points[i].repetitions+' reps':''}</title></circle>`).join('')}
    </svg>
    <div style="display:flex; justify-content:space-between; font-size:12px; color:var(--ink-light); margin-top:2px;">
      <span>${points[0].dateLabel} · ${points[0].poids}kg</span>
      <span style="font-weight:600; color:${evoColor};">${points[last].dateLabel} · ${points[last].poids}kg (${evoTxt})</span>
    </div>
  `;
}

async function renderProgression(id){
  const box = document.getElementById("progression-exercices");
  if (!id){ box.innerHTML = ""; return; }
  const { data, error } = await supabaseClient.rpc("get_performances", { p_cliente_id: id });
  if (error || !data || !data.length){ box.innerHTML = ""; return; }
  const parExercice = {};
  data.forEach(p => {
    if (p.poids == null) return;
    (parExercice[p.nom_exercice] = parExercice[p.nom_exercice] || []).push(p);
  });
  const exercicesAvecHistorique = Object.keys(parExercice).filter(nom => parExercice[nom].length >= 2);
  if (!exercicesAvecHistorique.length){ box.innerHTML = ""; return; }
  box.innerHTML = `
    <fieldset>
      <legend>Progression (poids notés par la cliente)</legend>
      ${exercicesAvecHistorique.map(nom => {
        const points = parExercice[nom].map(p => ({
          poids: Number(p.poids), repetitions: p.repetitions,
          dateLabel: new Date(p.created_at).toLocaleDateString("fr-FR", { day:"numeric", month:"short" }),
        }));
        return `<div style="margin-bottom:16px;">
          <strong style="font-size:14px;">${nom}</strong>
          ${sparklinePoids(points)}
        </div>`;
      }).join("")}
    </fieldset>
  `;
}

        <div style="display:flex; gap:8px;">
          <input type="text" id="lien-suivi" value="${lien}" readonly style="font-size:12px;">
          <button type="button" id="copier-lien-btn" class="btn-ghost" style="width:auto;">Copier</button>
        </div>
      </div>
      <div style="margin-top:16px;">
        ${error ? `<p>Erreur de chargement des check-ins.</p>` :
          !data.length ? `<p style="color:var(--ink-light); font-style:italic;">Aucun suivi reçu pour l'instant.</p>` :
          data.map((c, i) => {
            const precedent = data[i+1];
            const deltaPoids = (c.poids != null && precedent && precedent.poids != null) ? +(c.poids - precedent.poids).toFixed(1) : null;
            const badge = coherenceBadge(objectif, deltaPoids);
            return `
            <div class="detail-row">
              <span class="k">${new Date(c.created_at).toLocaleDateString("fr-FR", { day:"numeric", month:"long", year:"numeric" })}</span>
              ${c.poids ? `Poids : ${c.poids} kg${deltaPoids != null ? ` (${deltaPoids > 0 ? "+" : ""}${deltaPoids} kg)` : ""} — ` : ""}
              ${c.tour_taille ? `Tour de taille : ${c.tour_taille} cm — ` : ""}
              Énergie : ${c.energie}/10 — Sport suivi : ${c.sport_suivi||0}% — Nutrition suivie : ${c.nutrition_suivi||0}%
              ${badge ? `<br>${badge}` : ""}
              ${c.sommeil ? `<br>Sommeil : ${SCALE_LABELS.sommeil[c.sommeil]}` : ""}
              ${c.ressenti_force ? `<br>Force ressentie : ${SCALE_LABELS.ressenti_force[c.ressenti_force]}` : ""}
              ${c.appetit ? `<br>Faim / satiété : ${SCALE_LABELS.appetit[c.appetit]}` : ""}
              ${c.satisfaction ? `<br>Satisfaction : ${SCALE_LABELS.satisfaction[c.satisfaction]}` : ""}
              ${c.difficultes ? `<br><em>Difficultés : ${c.difficultes}</em>` : ""}
              ${c.commentaire ? `<br><em>${c.commentaire}</em>` : ""}
            </div>
          `;
          }).join("")
        }
      </div>
    </fieldset>
  `;
  document.getElementById("copier-lien-btn").addEventListener("click", () => {
    navigator.clipboard.writeText(lien).then(() => {
      const btn = document.getElementById("copier-lien-btn");
      btn.textContent = "Copié !";
      setTimeout(() => { btn.textContent = "Copier"; }, 1500);
    });
  });
}

async function enregistrerFiche(){
  if (!dernierResultat){ alert("Génère d'abord un planning avant d'enregistrer."); return; }
  const { client, planSport, planRepas, liste } = dernierResultat;
  const row = {
    prenom: client.prenom, email: client.email || null, telephone: client.telephone || null,
    age: client.age, sexe: client.sexe, objectif: client.objectif, objectif_secondaire: client.objectifSecondaire,
    delai_mois: client.delaiMois,
    poids_actuel: client.poidsActuel, poids_souhaite: client.poidsSouhaite,
    niveau: client.niveau, type_effort: client.typeEffort,
    zones_prioritaires: client.zonesPrioritaires, problemes_sante: client.problemesSante,
    sante_hormonale: client.santeHormonale, maladie_chronique: client.maladieChronique || null,
    douleur_actuelle: client.douleurActuelle,
    exclude_exercices: client.excludeIds, exercices_preferes: client.preferIds, jours_dispo: client.joursDispo,
    jours_repos: client.joursRepos,
    duree_seance: client.dureeSeance, lieu: client.lieu, materiel: client.materiel,
    moment_prefere: client.momentPrefere, heure_reveil: client.heureReveilRaw, heure_debut_travail: client.heureDebutTravailRaw,
    trajet_domicile_salle: client.trajetDomicileSalle, trajet_salle_travail: client.trajetSalleTravail, tampon_repas: client.tamponRepas,
    vegetarien: client.vegetarien, vegan: client.vegan, sans_gluten: client.sansGluten, sans_lactose: client.sansLactose,
    aliments_evites: client.alimentsEvites, aliments_evites_libre: client.alimentsEvitesLibre, repas_inclus: client.repasInclus,
    recettes_preferees: client.recettesPreferees, supermarche: client.supermarche, budget_semaine: client.budgetSemaine,
    dernier_planning_sport: planSport, dernier_planning_repas: planRepas, derniere_liste_courses: liste,
  };
  const btn = document.getElementById("enregistrer-btn");
  btn.disabled = true; btn.textContent = "Enregistrement…";
  let result;
  if (clienteActuelleId){
    result = await supabaseClient.from("clientes").update(row).eq("id", clienteActuelleId).select().single();
  } else {
    result = await supabaseClient.from("clientes").insert(row).select().single();
  }
  btn.disabled = false; btn.textContent = "💾 Enregistrer cette fiche";
  if (result.error){ alert("Erreur d'enregistrement : " + result.error.message); return; }
  clienteActuelleId = result.data.id;
  if (prospectActuelId){
    await supabaseClient.from("prospects").update({ converti: true, cliente_id: clienteActuelleId }).eq("id", prospectActuelId);
    prospectActuelId = null;
    document.getElementById("notes-prospect").innerHTML = "";
    chargerProspects();
  }
  chargerListeClientes();
  renderSuivi(clienteActuelleId, result.data.prenom, result.data.objectif);
  renderProgression(clienteActuelleId);
  await chargerActivitesLibres(clienteActuelleId);
  if (assistantPrenomActuel !== result.data.prenom) reinitialiserAssistant(result.data.prenom);
  toggleAssistantBulle();
  rerenderResultats();
}

// ---- Génération ----
function genererEtAfficher(){
  const client = collecterClient();
  if (!client.joursDispo.length){ alert("Sélectionne au moins un jour disponible."); return; }
  if (!client.repasInclus.length){ alert("Sélectionne au moins un repas à inclure."); return; }

  const planSport = genererPlanningSport(client);
  const planRepas = genererPlanningRepas(client);
  const liste = genererListeCourses(planRepas);
  const horaire = placementHoraire(client);
  dernierResultat = { client, planSport, planRepas, liste, horaire };
  afficherResultats(client, planSport, planRepas, liste, horaire);
}

function rerenderResultats(){
  const { client, planSport, planRepas, liste, horaire } = dernierResultat;
  afficherResultats(client, planSport, planRepas, liste, horaire, true);
}

function retirerExercice(jour, index){
  const seance = dernierResultat.planSport.seances.find(s => s.jour === jour);
  if (!seance) return;
  seance.exercices.splice(index, 1);
  rerenderResultats();
}

function ajouterExercice(jour, exerciceId){
  if (!exerciceId) return;
  const seance = dernierResultat.planSport.seances.find(s => s.jour === jour);
  const exo = EXERCICES.find(e => e.id === exerciceId);
  if (!seance || !exo) return;
  seance.exercices.push(exo);
  rerenderResultats();
}

function volumeZonesHtml(volumeParZone){
  const zones = Object.keys(volumeParZone);
  if (!zones.length) return "";
  zones.sort((a,b) => (volumeParZone[b].prioritaire - volumeParZone[a].prioritaire) || (ZONE_LABELS[a]||a).localeCompare(ZONE_LABELS[b]||b));
  const lignes = zones.map(zone => {
    const { series, prioritaire, cible } = volumeParZone[zone];
    const scaleMax = Math.max(cible[1] * 1.2, series, 1);
    const targetLeftPct = (cible[0] / scaleMax) * 100;
    const targetWidthPct = ((cible[1] - cible[0]) / scaleMax) * 100;
    const fillPct = Math.min(100, (series / scaleMax) * 100);
    const dansLaCible = series >= cible[0];
    const couleur = dansLaCible ? "var(--terracotta)" : "var(--terracotta-dark)";
    return `
      <div style="margin-bottom:12px;">
        <div style="display:flex; justify-content:space-between; align-items:baseline; font-size:13px; margin-bottom:4px;">
          <span><strong>${ZONE_LABELS[zone] || zone}</strong> <span style="font-size:10.5px; padding:1px 7px; border-radius:10px; border:1px solid var(--line); ${prioritaire ? "background:var(--sage-light); border-color:var(--sage);" : ""}">${prioritaire ? "Prioritaire" : "Entretien"}</span></span>
          <span style="color:${dansLaCible ? "var(--ink-light)" : "var(--terracotta-dark)"};">${series} séries/sem ${dansLaCible ? "" : "⚠"} <span style="color:var(--ink-light);">(objectif ${cible[0]}-${cible[1]})</span></span>
        </div>
        <div style="position:relative; height:10px; background:var(--line); border-radius:5px; overflow:hidden;">
          <div style="position:absolute; left:${targetLeftPct}%; width:${targetWidthPct}%; height:100%; background:var(--sage-light);"></div>
          <div style="position:relative; width:${fillPct}%; height:100%; background:${couleur}; border-radius:5px;"></div>
        </div>
      </div>`;
  }).join("");
  const zonesVides = zones.filter(z => volumeParZone[z].prioritaire && volumeParZone[z].series === 0);
  const alerteVide = zonesVides.length ? `
    <div style="background:#fdf1ee; border:1px solid var(--terracotta-dark); border-radius:8px; padding:10px 12px; margin-bottom:14px; font-size:12.5px; line-height:1.5;">
      <strong>⚠ ${zonesVides.map(z => ZONE_LABELS[z] || z).join(", ")} à 0 série</strong> — aucun exercice de la bibliothèque pour cette zone ne passe le matériel et les contre-indications de la cliente : c'est un vrai trou de contenu, pas un souci d'affichage. Ajoute manuellement un exercice adapté sur les jours concernés (bouton « + Ajouter un exercice » ci-dessous) ou préviens-moi de la zone/du matériel concerné pour que j'enrichisse la bibliothèque.
    </div>` : "";
  return `
    <div class="card" style="margin-bottom:24px;">
      <strong style="font-size:14px;">Volume hebdomadaire par zone</strong>
      <div class="hint" style="margin-bottom:12px;">Nombre de séries de renforcement sur la semaine complète — les zones prioritaires visent 12-20 séries/semaine (repères d'entraînement standards), les zones d'entretien 6-10, ajusté selon le niveau.</div>
      ${alerteVide}
      ${lignes}
    </div>`;
}

// Ce que la cliente a fait de son côté (course, vélo, marche...) en dehors
// du planning prévu, ajouté par la coach pour que le suivi reflète la
// réalité — visible ici et sur le lien envoyé à la cliente.
function activitesLibresHtml(jour){
  const activites = activitesLibres.filter(a => a.jour === jour);
  const liste = activites.length ? `
    <ul style="margin:8px 0 0; padding-left:0; list-style:none; font-size:13.5px;">
      ${activites.map(a => `<li style="display:flex; justify-content:space-between; align-items:center; gap:8px; padding:4px 0;"><span>🏃 ${a.description}</span>${clienteActuelleId ? `<button type="button" class="activite-remove-btn" data-id="${a.id}" title="Retirer" style="border:none; background:none; cursor:pointer; color:var(--ink-light);">✕</button>` : ""}</li>`).join("")}
    </ul>` : "";
  const ajout = clienteActuelleId ? `
    <div style="display:flex; gap:8px; margin-top:8px; align-items:center;">
      <input type="text" class="activite-add-input" data-jour="${jour}" placeholder="Ex : course à pied 30 min" style="flex:1; font-size:13px;">
      <button type="button" class="btn-ghost activite-add-btn" data-jour="${jour}" style="width:auto;">+ Activité perso</button>
    </div>` : "";
  if (!liste && !ajout) return "";
  return `<div style="margin-top:10px;">${liste}${ajout}</div>`;
}

function afficherResultats(client, planSport, planRepas, liste, horaire, skipScroll){
  const resultats = document.getElementById("resultats");
  const coutEstime = estimerCoutListe(liste, client.supermarche);
  const surBudget = client.budgetSemaine && coutEstime > client.budgetSemaine;
  resultats.innerHTML = `
    <div class="results-actions">
      <button id="enregistrer-btn">💾 Enregistrer cette fiche</button>
      <button id="regenerer-btn" class="btn-ghost">↻ Régénérer</button>
      <button id="print-btn" class="btn-ghost">🖨 Imprimer / PDF</button>
    </div>

    <h2 style="font-size:22px;">Planning de ${client.prenom}</h2>
    ${clienteActuelleId ? `
    <div class="field" style="margin:14px 0 20px;">
      <label class="q">Lien du planning à envoyer à ${client.prenom} (WhatsApp, SMS...)</label>
      <div style="display:flex; gap:8px;">
        <input type="text" id="lien-planning" value="${window.location.origin}${window.location.pathname.replace("generateur.html","")}mon-planning.html?id=${clienteActuelleId}" readonly style="font-size:12px;">
        <button type="button" id="copier-lien-planning-btn" class="btn-ghost" style="width:auto;">Copier</button>
      </div>
      <div class="hint">Enregistre la fiche d'abord si tu viens de la modifier, pour que le lien reflète la dernière version.</div>
    </div>` : `<div class="hint" style="margin:10px 0 20px;">Enregistre cette fiche pour obtenir un lien à envoyer à ${client.prenom}.</div>`}
    <div class="summary-stats">
      <div class="stat-block"><div class="n">${planSport.nbSeances}</div><div class="l">Séances / semaine</div></div>
      <div class="stat-block"><div class="n">${planRepas.proteinesCible}g</div><div class="l">Protéines / jour visées</div></div>
      <div class="stat-block"><div class="n" style="${surBudget ? "color:var(--terracotta-dark);" : ""}">${coutEstime.toFixed(0)}€${client.budgetSemaine ? ` / ${client.budgetSemaine}€` : ""}</div><div class="l">Courses estimées / semaine</div></div>
    </div>
    ${surBudget ? `<div class="card" style="margin-bottom:24px; border-color:var(--terracotta-dark);"><strong style="color:var(--terracotta-dark);">⚠ Le coût estimé dépasse le budget fixé.</strong> Réduis les portions, clique "Régénérer" (les recettes économiques sont déjà privilégiées), ou augmente le budget.</div>` : ""}

    ${horaire ? `<div class="card" style="margin-bottom:24px;">${horaire.possible ? `<strong>Créneau type :</strong> ${horaire.resume}` : `<strong style="color:var(--terracotta-dark);">⚠ ${horaire.message}</strong>`}</div>` : ""}

    ${volumeZonesHtml(calculerVolumeParZone(planSport, client.niveau, client.zonesPrioritaires))}

    <h3 style="font-size:19px; margin-bottom:12px;">Planning sport</h3>
    ${[...planSport.seances.map(s => ({ ...s, repos:false })), ...planSport.reposJours].sort((a,b) => JOURS.indexOf(a.jour) - JOURS.indexOf(b.jour)).map(s => s.repos ? `
      <div class="plan-day">
        <h3>${s.jour} — Repos</h3>
        <div class="day-meta" style="color:var(--ink-light);">${s.suggestion}</div>
        ${activitesLibresHtml(s.jour)}
      </div>
    ` : `
      <div class="plan-day" data-jour="${s.jour}">
        <h3>${s.jour} — ${s.typeJour}</h3>
        <div class="day-meta">${client.lieu === "salle" ? "Salle de sport" : client.lieu === "maison" ? "À la maison" : client.lieu === "exterieur" ? "Extérieur" : "Selon disponibilité"} · ${client.dureeSeance} min</div>
        ${s.adaptee ? `<div class="day-meta" style="color:var(--terracotta-dark);">⚠ Séance adaptée — douleurs signalées, charge allégée et abdos à faible pression.</div>` : ""}
        <table class="plan-table">
          <thead><tr><th>Exercice</th><th>Zone</th><th>Format</th><th>Poids utilisé</th><th></th></tr></thead>
          <tbody>${s.exercices.map((e,i) => `<tr><td>${e.nom}</td><td>${ZONE_LABELS[e.zone]}</td><td>${e.format}</td><td><input type="number" step="0.5" class="ex-poids-input" data-jour="${s.jour}" data-idx="${i}" value="${e.poidsUtilise || ""}" placeholder="ex : 20" style="width:64px;"> kg</td><td><button type="button" class="ex-remove-btn" data-jour="${s.jour}" data-idx="${i}" title="Retirer cet exercice">✕</button></td></tr>`).join("") || `<tr><td colspan="5">Pas assez d'exercices disponibles avec ces filtres — élargis le matériel ou les zones.</td></tr>`}</tbody>
        </table>
        <div class="ex-add-row" style="display:flex; gap:8px; margin-top:10px; align-items:center;">
          <select class="ex-add-select" data-jour="${s.jour}" style="flex:1;">
            <option value="">+ Ajouter un exercice…</option>
            ${Object.keys(ZONE_LABELS).map(z => `<optgroup label="${ZONE_LABELS[z]}">${EXERCICES.filter(e=>e.zone===z).map(e=>`<option value="${e.id}">${e.nom} (${e.format})</option>`).join("")}</optgroup>`).join("")}
          </select>
          <button type="button" class="btn-ghost ex-add-btn" data-jour="${s.jour}" style="width:auto;">Ajouter</button>
        </div>
        ${s.etirements && s.etirements.length ? `
        <div style="margin-top:10px;">
          <strong style="font-size:13px; color:var(--ink-light);">Étirements (fin de séance)</strong>
          <ul style="margin:6px 0 0; padding-left:18px; font-size:13.5px;">${s.etirements.map(e => `<li>${e.nom} — ${e.format}</li>`).join("")}</ul>
        </div>` : ""}
        ${activitesLibresHtml(s.jour)}
      </div>
    `).join("")}

    <h3 style="font-size:19px; margin:28px 0 12px;">Planning repas</h3>
    ${planRepas.jours.map(j => `
      <div class="plan-day">
        <h3>${j.jour}</h3>
        ${client.repasInclus.map(slot => {
          const r = j.repas[slot];
          if (!r) return `<div class="meal-row"><span class="slot">${REPAS_LABELS[slot]}</span><span>— pas de recette compatible, à compléter manuellement —</span></div>`;
          return `
          <details class="meal-row" style="display:block;">
            <summary style="display:flex; justify-content:space-between; gap:10px; cursor:pointer; list-style:none;">
              <span class="slot">${REPAS_LABELS[slot]}</span>
              <span>${r.nom}</span>
            </summary>
            <div class="meal-detail">
              <strong>Ingrédients</strong> (1 portion) : ${r.ingredients.map(i=>`${i.nom} (${i.quantite} ${i.unite})`).join(", ")}
              <div style="margin-top:8px;"><strong>Préparation — fiche batch cooking</strong></div>
              <ol style="margin:6px 0 0; padding-left:18px;">${(r.etapes||[]).map(e=>`<li>${e}</li>`).join("") || "<li>Pas d'étapes renseignées.</li>"}</ol>
            </div>
          </details>`;
        }).join("")}
      </div>
    `).join("")}

    <h3 style="font-size:19px; margin:28px 0 12px;">Liste de courses (semaine) — prix ${SUPERMARCHE_LABELS[client.supermarche] || "indicatifs"}</h3>
    <div class="card">
      <div class="shopping-grid">
        ${liste.map(i => `<div>${i.nom} — ${i.quantite} ${i.unite} <span style="color:var(--ink-light); font-size:12px;">(${(i.quantite * prixIngredient(i.nom, i.unite, client.supermarche)).toFixed(2)}€)</span></div>`).join("")}
      </div>
    </div>
  `;

  document.getElementById("enregistrer-btn").addEventListener("click", enregistrerFiche);
  document.getElementById("regenerer-btn").addEventListener("click", genererEtAfficher);
  document.getElementById("print-btn").addEventListener("click", () => window.print());
  const lienPlanningInput = document.getElementById("lien-planning");
  if (lienPlanningInput){
    document.getElementById("copier-lien-planning-btn").addEventListener("click", () => {
      navigator.clipboard.writeText(lienPlanningInput.value).then(() => {
        const btn = document.getElementById("copier-lien-planning-btn");
        btn.textContent = "Copié !";
        setTimeout(() => { btn.textContent = "Copier"; }, 1500);
      });
    });
  }
  resultats.querySelectorAll(".ex-remove-btn").forEach(btn => {
    btn.addEventListener("click", () => retirerExercice(btn.dataset.jour, Number(btn.dataset.idx)));
  });
  resultats.querySelectorAll(".ex-poids-input").forEach(input => {
    input.addEventListener("change", () => {
      const seance = dernierResultat.planSport.seances.find(s => s.jour === input.dataset.jour);
      if (!seance) return;
      seance.exercices[Number(input.dataset.idx)].poidsUtilise = input.value.trim();
    });
  });
  resultats.querySelectorAll(".ex-add-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const select = resultats.querySelector(`.ex-add-select[data-jour="${btn.dataset.jour}"]`);
      ajouterExercice(btn.dataset.jour, select.value);
    });
  });
  resultats.querySelectorAll(".activite-remove-btn").forEach(btn => {
    btn.addEventListener("click", () => retirerActiviteLibre(btn.dataset.id));
  });
  resultats.querySelectorAll(".activite-add-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const input = resultats.querySelector(`.activite-add-input[data-jour="${btn.dataset.jour}"]`);
      ajouterActiviteLibre(btn.dataset.jour, input.value);
    });
  });
  resultats.querySelectorAll(".activite-add-input").forEach(input => {
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter"){ e.preventDefault(); ajouterActiviteLibre(input.dataset.jour, input.value); }
    });
  });
  if (!skipScroll) resultats.scrollIntoView({ behavior:"smooth" });
}
