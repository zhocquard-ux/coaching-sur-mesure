<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suivi hebdomadaire — Coaching Sur-Mesure</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="brand-mark">Coaching <em>Sur-Mesure</em></a>
  </div>
</header>

<div class="q-wrap" id="app"></div>

<footer class="site-footer">
  <div class="footer-inner"><a href="index.html" class="footer-back">← Retour au site</a></div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const clienteId = params.get("id");
const prenom = params.get("nom") || "";
const objectif = params.get("obj") || "";

function scaleChoices(id, labels){
  return `<div class="choices" id="${id}">${labels.map((l,i) => `<div class="choice" data-value="${i+1}">${l}</div>`).join("")}</div>`;
}

function render(){
  const app = document.getElementById("app");
  if (!clienteId){
    app.innerHTML = `<div class="card"><p>Lien invalide — demande à ton coach de te renvoyer ton lien personnel de suivi.</p></div>`;
    return;
  }
  const showForce = objectif === "prise_masse" || objectif === "tonus";
  const showAppetit = objectif === "perte_poids" || objectif === "endurance";
  app.innerHTML = `
    <div class="form-intro">
      <div class="eyebrow">Coaching sport & nutrition</div>
      <h1 style="font-size:26px; margin-top:6px;">Suivi hebdomadaire</h1>
      <p>${prenom ? "Salut " + prenom + " ! " : ""}Prends 2 minutes pour faire le point sur ta semaine.</p>
    </div>
    <div class="card">
      <div class="field">
        <label class="q">Ton poids actuel (kg)</label>
        <div class="hint">Facultatif, seulement si tu le suis</div>
        <input type="number" id="f-poids" step="0.1">
      </div>
      <div class="field">
        <label class="q">Ton tour de taille (cm)</label>
        <div class="hint">Facultatif — souvent plus parlant que le poids seul</div>
        <input type="number" id="f-taille" step="0.5">
      </div>
      <div class="field">
        <label class="q">Ton niveau d'énergie cette semaine (1 = épuisée, 10 = au top)</label>
        <input type="range" id="f-energie" min="1" max="10" value="6">
        <div class="hint" id="energie-val" style="text-align:center; font-size:16px; color:var(--terracotta-dark);">6</div>
      </div>
      <div class="field">
        <label class="q">As-tu suivi le programme sport ?</label>
        <div class="choices" id="sport-choices">
          ${["Pas du tout","Un peu","La moitié","La plupart","Totalement"].map((l,i) => `<div class="choice" data-value="${(i+1)*20}">${l}</div>`).join("")}
        </div>
      </div>
      <div class="field">
        <label class="q">As-tu suivi le plan nutrition ?</label>
        <div class="choices" id="nutrition-choices">
          ${["Pas du tout","Un peu","La moitié","La plupart","Totalement"].map((l,i) => `<div class="choice" data-value="${(i+1)*20}">${l}</div>`).join("")}
        </div>
      </div>
      <div class="field">
        <label class="q">Comment as-tu dormi cette semaine ?</label>
        ${scaleChoices("sommeil-choices", ["Très mal","Mal","Correct","Bien","Très bien"])}
      </div>
      ${showForce ? `
      <div class="field">
        <label class="q">As-tu senti une progression en force (charges, répétitions) ?</label>
        ${scaleChoices("force-choices", ["Aucune","Un peu","Stable","Bonne","Très nette"])}
      </div>` : ""}
      ${showAppetit ? `
      <div class="field">
        <label class="q">Comment était ta faim / sensation de satiété avec le plan ?</label>
        ${scaleChoices("appetit-choices", ["Faim constante","Souvent faim","Correct","Bien rassasiée","Très rassasiée"])}
      </div>` : ""}
      <div class="field">
        <label class="q">Es-tu satisfaite de ton programme cette semaine ?</label>
        ${scaleChoices("satisfaction-choices", ["Pas du tout","Peu","Moyennement","Satisfaite","Très satisfaite"])}
      </div>
      <div class="field">
        <label class="q">Des difficultés cette semaine ?</label>
        <div class="hint">Douleur sur un exercice en particulier, fatigue, manque de temps, motivation...</div>
        <textarea id="f-difficultes" placeholder="Ex : douleur à l'épaule sur le développé militaire"></textarea>
      </div>
      <div class="field">
        <label class="q">Autre chose à me dire ?</label>
        <textarea id="f-commentaire"></textarea>
      </div>
      <button id="envoyer-btn">Envoyer mon suivi</button>
    </div>
  `;

  ["sommeil-choices","force-choices","appetit-choices","satisfaction-choices"].forEach(id => {
    const box = document.getElementById(id);
    if (!box) return;
    box.querySelectorAll(".choice").forEach(c => c.addEventListener("click", () => {
      box.querySelectorAll(".choice").forEach(x => x.classList.remove("selected"));
      c.classList.add("selected");
    }));
  });

  const energieInput = document.getElementById("f-energie");
  energieInput.addEventListener("input", () => { document.getElementById("energie-val").textContent = energieInput.value; });

  let sportVal = null, nutritionVal = null;
  document.querySelectorAll("#sport-choices .choice").forEach(c => c.addEventListener("click", () => {
    document.querySelectorAll("#sport-choices .choice").forEach(x => x.classList.remove("selected"));
    c.classList.add("selected");
    sportVal = Number(c.dataset.value);
  }));
  document.querySelectorAll("#nutrition-choices .choice").forEach(c => c.addEventListener("click", () => {
    document.querySelectorAll("#nutrition-choices .choice").forEach(x => x.classList.remove("selected"));
    c.classList.add("selected");
    nutritionVal = Number(c.dataset.value);
  }));

  function scaleValue(id){
    const box = document.getElementById(id);
    if (!box) return null;
    const sel = box.querySelector(".choice.selected");
    return sel ? Number(sel.dataset.value) : null;
  }

  document.getElementById("envoyer-btn").addEventListener("click", async () => {
    const btn = document.getElementById("envoyer-btn");
    btn.disabled = true; btn.textContent = "Envoi en cours...";
    const row = {
      cliente_id: clienteId,
      poids: document.getElementById("f-poids").value ? Number(document.getElementById("f-poids").value) : null,
      tour_taille: document.getElementById("f-taille").value ? Number(document.getElementById("f-taille").value) : null,
      energie: Number(energieInput.value),
      sport_suivi: sportVal,
      nutrition_suivi: nutritionVal,
      sommeil: scaleValue("sommeil-choices"),
      ressenti_force: scaleValue("force-choices"),
      appetit: scaleValue("appetit-choices"),
      satisfaction: scaleValue("satisfaction-choices"),
      difficultes: document.getElementById("f-difficultes").value.trim(),
      commentaire: document.getElementById("f-commentaire").value.trim(),
    };
    const { error } = await supabaseClient.from("checkins").insert(row);
    if (error){
      btn.disabled = false; btn.textContent = "Envoyer mon suivi";
      alert("Une erreur est survenue, réessaie dans un instant.");
      return;
    }
    app.innerHTML = `<div class="thankyou"><div class="mark">✓</div><h2>Merci !</h2><p>Ton suivi est bien envoyé. À la semaine prochaine !</p></div>`;
  });
}
render();
</script>
</body>
</html>
