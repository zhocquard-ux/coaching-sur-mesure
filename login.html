<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — Coaching Sur-Mesure</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="brand-mark">Coaching <em>Sur-Mesure</em></a>
  </div>
</header>

<div class="gen-wrap">
  <div class="passcode-box">
    <div class="eyebrow">Outil interne</div>
    <h1 style="font-size:24px; margin-top:6px;">Connexion</h1>
    <div class="field" style="text-align:left; margin-top:20px;">
      <label class="q">Email</label>
      <input type="email" id="f-email" autocomplete="username">
    </div>
    <div class="field" style="text-align:left; margin-top:14px;">
      <label class="q">Mot de passe</label>
      <input type="password" id="f-password" autocomplete="current-password">
    </div>
    <div id="login-error" style="color:var(--terracotta-dark); font-size:12.5px; height:16px; margin-top:8px;"></div>
    <div style="margin-top:10px;"><button id="login-btn" style="width:auto;">Se connecter</button></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>
async function checkSession(){
  const { data } = await supabaseClient.auth.getSession();
  if (data.session) window.location.href = "generateur.html";
}
checkSession();

async function login(){
  const email = document.getElementById("f-email").value.trim();
  const password = document.getElementById("f-password").value;
  const errorBox = document.getElementById("login-error");
  errorBox.textContent = "";
  const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if (error){
    errorBox.textContent = "Email ou mot de passe incorrect.";
    return;
  }
  window.location.href = "generateur.html";
}
document.getElementById("login-btn").addEventListener("click", login);
document.getElementById("f-password").addEventListener("keydown", e => { if (e.key === "Enter") login(); });
</script>
</body>
</html>
